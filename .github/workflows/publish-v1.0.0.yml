name: Publish EnchantReveal 1.0.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.0.0.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v1.0.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve and verify the tested release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # These Git blobs preserve the exact tested binaries; no source rebuild is performed.
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/3e51081c3752ee0802fc70dd2918f3eb40d7050d" --jq .content | base64 --decode > "release/EnchantReveal-Paper-1.0.0.jar"
          echo '6b0f9cc6b048dd5ec8d20e966fdef6695a2883bd7eb002806fa1e982c7f12bde  release/EnchantReveal-Paper-1.0.0.jar' | sha256sum --check
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/ba62d78f66b4691c184fcc2c939760a1583e1633" --jq .content | base64 --decode > "release/EnchantReveal-Fabric-1.0.0.jar"
          echo 'a6a3994e8812acb8cefd747e2d839013b5431755338400f12a8b1b04ce2ab7b1  release/EnchantReveal-Fabric-1.0.0.jar' | sha256sum --check
      - name: Publish the release and attach both JARs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release/notes.md <<'NOTES'
          ## EnchantReveal 1.0.0
          
          Full enchanting results directly in the original enchanting-table tooltip. No chat output.
          
          Install both components:
          - `EnchantReveal-Paper-1.0.0.jar` → the Paper server's `plugins/` directory.
          - `EnchantReveal-Fabric-1.0.0.jar` → each player's Fabric instance `mods/` directory, alongside Fabric API for the exact Minecraft version.
          
          Supports Minecraft/Paper 26.1.2, 26.2 and 26.3. Requires Java 25.
          
          Paper 26.2 build 134 with the Fabric client has owner-confirmed in-game operation. Other listed versions have compilation, protocol and injection-target checks.
          
          This initial repository release renumbers the tested development build. Program class files and wire protocol are unchanged.
          
          See the repository README for setup, troubleshooting, compatibility limits and source builds.
          NOTES
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.0 release/*.jar --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.0.0 release/*.jar --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'EnchantReveal 1.0.0' --notes-file release/notes.md
          fi
